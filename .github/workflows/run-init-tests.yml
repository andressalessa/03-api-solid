name: Run Init Tests

on: [push]

jobs:
  run-init-tests:
    name: Run Init Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: |
          npm ci
          npm run test
